<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#6366F1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="20" y="20" width="360" height="360" rx="90" fill="url(#bgGrad)" filter="url(#softShadow)"/>

  <!-- Subtle inner glow ring -->
  <rect x="20" y="20" width="360" height="360" rx="90" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Code bracket left -->
  <path d="M 110 140 L 70 200 L 110 260" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Code bracket right -->
  <path d="M 290 140 L 330 200 L 290 260" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Monogram BKD -->
  <text x="200" y="228" font-family="'Poppins', 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="700" fill="url(#textGrad)" text-anchor="middle" letter-spacing="2">BKD</text>

  <!-- Small accent dot -->
  <circle cx="200" cy="290" r="5" fill="#FFFFFF" fill-opacity="0.8"/>
</svg>
